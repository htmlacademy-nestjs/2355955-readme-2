# Запуск из каталога apps/post (рядом с этим файлом):
# docker compose \
#   --file ./docker-compose.dev.yml \
#   --env-file ./post.env \
#   --project-name "typoteka-post" \
#   up \
#   -d
services:
  # Postgres; данные в томе readme_post_postgres_data
  readme.post.postgres:
    image: postgres:17
    container_name: readme.post.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - readme_post_postgres_data:/var/lib/postgresql/data
    networks:
      - readme_post_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgAdmin: http://localhost:5050; в сервере БД укажи host readme.post.postgres
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: readme.post.pgadmin
    ports:
      - '5050:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_DISABLE_POSTFIX: ${PGADMIN_DISABLE_POSTFIX}
    volumes:
      - readme_post_pgadmin_data:/var/lib/pgadmin
    networks:
      - readme_post_network
    depends_on:
      readme.post.postgres:
        condition: service_healthy

volumes:
  readme_post_postgres_data:
  readme_post_pgadmin_data:

# Общая сеть: сервисы ссылаются ключом readme_post_network
networks:
  readme_post_network:
    name: readme_post_network
